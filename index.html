<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的 R2 视频播放器</title>
    <!-- 引入 Video.js 样式 -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .video-container { width: 90%; max-width: 960px; }
        .video-js { width: 100%; height: auto; }
    </style>
</head>
<body>

<div class="video-container">
    <video
        id="my-video"
        class="video-js vjs-big-play-centered"
        controls
        preload="auto"
        data-setup='{}'>
        <!-- 把这里的 src 换成你在 R2 获取的公共链接 -->
        <source src="https://pub-3800963a69234c36acf2406e6a57502a.r2.dev/05_PlayerHUD.mp4" />
        <p class="vjs-no-js">您的浏览器不支持 JavaScript。</p>
    </video>
</div>

<!-- 引入 Video.js 脚本 -->
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

</body>
</html>
